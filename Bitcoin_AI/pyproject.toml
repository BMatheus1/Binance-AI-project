[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-ai-research"
version = "0.1.0"
description = "Pesquisa quantitativa local BTCUSDT; sem execução financeira"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "pandas>=2.2", "pyarrow>=15", "scikit-learn>=1.5", "joblib>=1.3", "pypdf>=5", "aiohttp>=3.10", "websockets>=13"]

[project.optional-dependencies]
boosting = ["xgboost>=2", "catboost>=1.2"]
kronos = ["torch>=2", "einops==0.8.1", "huggingface_hub==0.33.1", "safetensors==0.6.2"]
nlp = ["torch>=2", "transformers>=4.51,<5", "huggingface_hub>=0.33", "safetensors>=0.6", "pydantic>=2.8,<3"]
demo = ["requests>=2.32", "python-dotenv>=1.0"]
dashboard = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "httpx>=0.28", "psutil>=6"]
dev = ["pytest>=8"]

[project.scripts]
btc-research = "btc_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
