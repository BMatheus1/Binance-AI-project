[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-ai-research"
version = "0.1.0"
description = "Pesquisa quantitativa local BTCUSDT; sem execução financeira"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "pandas>=2.2", "pyarrow>=15", "scikit-learn>=1.5", "joblib>=1.3", "pypdf>=5"]

[project.optional-dependencies]
boosting = ["xgboost>=2", "catboost>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
btc-research = "btc_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
